name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TodoLock.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoLock-apk
          path: out/TodoLock.apk
          if-no-files-found: error

      # 폰에서 바로 눌러 설치할 수 있도록 Release 로도 올립니다
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TodoLock build ${{ github.run_number }}
          body: "폰에서 아래 TodoLock.apk 를 눌러 설치하세요."
          files: out/TodoLock.apk
