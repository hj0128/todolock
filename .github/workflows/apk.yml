name: Build APK

# 푸시마다 '빌드가 되는지' 는 확인하되, 릴리즈는 태그를 붙였을 때만 만듭니다.
# 리드미만 고쳐도 릴리즈가 하나씩 쌓여, 어느 것이 실제 배포본인지 알 수 없게
# 되었기 때문입니다.
#
#   git tag v1.4 && git push origin v1.4
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 서명 키가 있는 저장소에서만 배포용(release) 빌드를 합니다.
    # 포크에는 시크릿이 전달되지 않으므로 그쪽은 debug 빌드로 떨어져
    # '빌드가 되는지' 만 검증합니다.
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      # 태그만 올리고 버전 올리는 것을 잊으면, 1.4 가 1.5 라는 이름으로
      # 배포됩니다. 나중에는 어느 apk 가 무엇인지 알 수 없게 되므로 여기서 막습니다.
      - name: 태그와 versionName 이 같은지 확인
        if: env.IS_TAG == 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "태그 $TAG / versionName $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::태그(v$TAG)와 versionName($VER)이 다릅니다."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 버전을 지정하지 않으면 래퍼(gradle-wrapper.properties)의 버전을 씁니다.
      # 로컬과 CI 가 같은 Gradle 로 빌드되도록 래퍼에 맡깁니다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 키스토어는 저장소에 없습니다. 시크릿에서 꺼내 러너의 임시 폴더에만 풀고,
      # keystore.properties 를 만들어 build.gradle.kts 가 그것을 읽게 합니다.
      # (RUNNER_TEMP 는 작업이 끝나면 러너와 함께 사라집니다)
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=todolock-upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: env.HAS_KEY == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (키 없는 포크용)
        if: env.HAS_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 배포하는 APK 가 정말 업로드 키로 서명됐는지 확인합니다.
      # debug 키로 서명된 것이 배포되면 누구나 같은 서명의 '업데이트' 를 만들 수
      # 있으므로, 여기서 걸러지지 않으면 의미가 없습니다.
      - name: Verify signature
        if: env.HAS_KEY == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=TodoLock" certs.txt

      - name: Rename APK
        run: |
          mkdir -p out
          if [ "$HAS_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/TodoLock.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/TodoLock.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoLock-apk
          path: out/TodoLock.apk
          if-no-files-found: error

      # 폰에서 바로 눌러 설치할 수 있도록 Release 로 올립니다.
      #
      # 태그를 붙인 커밋에서만, 그리고 서명된 빌드만 올립니다. 그냥 푸시한
      # 것은 위의 artifact 로만 남으므로 릴리즈 목록이 배포본으로만 채워집니다.
      #
      # 바깥 액션(softprops/action-gh-release) 대신 gh 를 쓰는 이유:
      # 그 액션이 러너의 Node 24 에서 인증서 검증에 걸려 죽었습니다
      # ("self-signed certificate"). gh 는 러너에 기본으로 깔려 있어
      # 의존성도 하나 줄어듭니다.
      - name: Publish to Releases
        if: env.IS_TAG == 'true' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/TodoLock.apk \
            --title "TodoLock $GITHUB_REF_NAME" \
            --notes "폰에서 아래 TodoLock.apk 를 눌러 설치하세요.

          처음 설치할 때는 '이 출처의 앱 설치 허용' 을 한 번 눌러야 하고,
          설치 뒤에는 앱 안의 ⚙ → \`권한 · 도구\` 에서 두 가지를 켜야
          잠금해제 팝업이 뜹니다."
