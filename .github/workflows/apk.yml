name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 서명 키가 있는 저장소에서만 배포용(release) 빌드를 합니다.
    # 포크에는 시크릿이 전달되지 않으므로 그쪽은 debug 빌드로 떨어져
    # '빌드가 되는지' 만 검증합니다.
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 버전을 지정하지 않으면 래퍼(gradle-wrapper.properties)의 버전을 씁니다.
      # 로컬과 CI 가 같은 Gradle 로 빌드되도록 래퍼에 맡깁니다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 키스토어는 저장소에 없습니다. 시크릿에서 꺼내 러너의 임시 폴더에만 풀고,
      # keystore.properties 를 만들어 build.gradle.kts 가 그것을 읽게 합니다.
      # (RUNNER_TEMP 는 작업이 끝나면 러너와 함께 사라집니다)
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=todolock-upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: env.HAS_KEY == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (키 없는 포크용)
        if: env.HAS_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 배포하는 APK 가 정말 업로드 키로 서명됐는지 확인합니다.
      # debug 키로 서명된 것이 배포되면 누구나 같은 서명의 '업데이트' 를 만들 수
      # 있으므로, 여기서 걸러지지 않으면 의미가 없습니다.
      - name: Verify signature
        if: env.HAS_KEY == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=TodoLock" certs.txt

      - name: Rename APK
        run: |
          mkdir -p out
          if [ "$HAS_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/TodoLock.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/TodoLock.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoLock-apk
          path: out/TodoLock.apk
          if-no-files-found: error

      # 폰에서 바로 눌러 설치할 수 있도록 Release 로도 올립니다.
      # 서명된 빌드만 올립니다 — 포크의 debug 산출물은 artifact 로만 남습니다.
      - name: Publish to Releases
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TodoLock build ${{ github.run_number }}
          body: |
            폰에서 아래 TodoLock.apk 를 눌러 설치하세요.
          files: out/TodoLock.apk
